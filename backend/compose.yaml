services:
  db:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: train_app
      POSTGRES_USER: train_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - train_app_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U train_app -d train_app"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  train_app_pg:
